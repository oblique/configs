# C-a as a second prefix, pressed twice it reaches the program in the pane
set -g prefix2 C-a
bind C-a send-prefix -2

# splitting keys
bind \\ split-window -h
bind - split-window -v

# set back the original binds
bind -r p previous-window # select previous window
bind -r n next-window     # select next window

# sets the window size to smallest so that tmux window is sized to the smallest participant
# With tmux 3.1 they changed the default, so we need to set it here
set-window-option -g window-size smallest

# Move between panes, smart-splits.nvim sets @pane-is-vim and takes the key itself
bind -n M-Left if -F '#{@pane-is-vim}' 'send-keys M-Left' 'select-pane -L'
bind -n M-Down if -F '#{@pane-is-vim}' 'send-keys M-Down' 'select-pane -D'
bind -n M-Up if -F '#{@pane-is-vim}' 'send-keys M-Up' 'select-pane -U'
bind -n M-Right if -F '#{@pane-is-vim}' 'send-keys M-Right' 'select-pane -R'
bind -T copy-mode-vi M-Left select-pane -L
bind -T copy-mode-vi M-Down select-pane -D
bind -T copy-mode-vi M-Up select-pane -U
bind -T copy-mode-vi M-Right select-pane -R

# Resize panes, same hand over to nvim as above
bind -n C-S-Left if -F '#{@pane-is-vim}' 'send-keys C-S-Left' 'resize-pane -L 2'
bind -n C-S-Down if -F '#{@pane-is-vim}' 'send-keys C-S-Down' 'resize-pane -D 2'
bind -n C-S-Up if -F '#{@pane-is-vim}' 'send-keys C-S-Up' 'resize-pane -U 2'
bind -n C-S-Right if -F '#{@pane-is-vim}' 'send-keys C-S-Right' 'resize-pane -R 2'

set -g base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -g @plugin 'catppuccin/tmux'
# Colours of the old gpakosz theme, laid over the mocha palette
set -g @thm_crust '#121212'
set -g @thm_mantle '#1c1c1c'
set -g @thm_surface_0 '#272727'
set -g @thm_overlay_0 '#444444'
set -g @thm_overlay_1 '#626262'
set -g @thm_green '#00ff87'
set -g @thm_blue '#5f87ff'
set -g @thm_mauve '#af87ff'
set -g @thm_red '#d7005f'
set -g @thm_white '#a0a8cd'

set -g @catppuccin_status_background 'none'
# The rounded style cannot draw its caps on a transparent bar, so spell them out
set -g @catppuccin_window_status_style 'custom'
set -g @catppuccin_window_left_separator '#[fg=#{@thm_surface_0},bg=default]'
set -g @catppuccin_window_middle_separator ' '
set -g @catppuccin_window_right_separator '#[fg=##{?window_bell_flag,##{@thm_red},##{@thm_green}},bg=default]'
set -g @catppuccin_window_current_left_separator '#[fg=#{@thm_surface_0},bg=default]'
set -g @catppuccin_window_current_middle_separator ' '
set -g @catppuccin_window_current_right_separator '#[fg=#{@thm_blue},bg=default]'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_text_color '#{@thm_surface_0}'
set -g @catppuccin_window_number_color '#{?window_bell_flag,#{@thm_red},#{@thm_green}}'
set -g @catppuccin_window_text '#[fg=#{@thm_white}]#W'
set -g @catppuccin_window_number '#I'
set -g @catppuccin_window_current_text_color '#{@thm_surface_0}'
set -g @catppuccin_window_current_number_color '#{@thm_blue}'
set -g @catppuccin_window_current_text '#[fg=#{@thm_white},bold,italics]#W'
set -g @catppuccin_window_current_number '#[nobold,noitalics]#I'
set -g @catppuccin_status_session_icon_bg '#{?client_prefix,#{@thm_red},#{@thm_mauve}}'
set -g @catppuccin_status_session_text_fg '#{@thm_white}'
set -g @catppuccin_status_directory_icon_bg '#{@thm_blue}'
set -g @catppuccin_status_directory_text_fg '#{@thm_overlay_1}'
set -g @catppuccin_status_left_separator ' '
set -g @catppuccin_status_right_separator ' '
set -g @catppuccin_status_connect_separator 'no'
set -g @catppuccin_pane_active_border_style 'fg=#{@thm_blue}'
# The theme marks the current window by colour, drop tmux's underline
set -g window-status-current-style default
set -g status-left-length 100
set -g status-right-length 100
set -g status-left '#{E:@catppuccin_status_session}'
set -g status-right '#{E:@catppuccin_status_directory}'

set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-filter-current 'false'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-bind-zo-new-window 'ctrl-y'

# tpm has to run after every plugin is declared
run '~/.tmux/plugins/tpm/tpm'

# The theme sets these on load, so they can only be changed after it
set -gF message-style 'fg=#{@thm_blue},bg=default,bold'
set -gF message-command-style 'fg=#{@thm_red},bg=default,bold'
set -gF mode-style 'fg=#{@thm_crust},bg=#{@thm_blue}'
set -g window-status-bell-style default
set -g window-status-activity-style default
set -g popup-style default
