# splitting keys
bind | split-window -h
bind _ split-window -v

# set back the original binds
bind -r p previous-window # select previous window
bind -r n next-window     # select next window

# sets the window size to smallest so that tmux window is sized to the smallest participant
# With tmux 3.1 they changed the default, so we need to set it here
set-window-option -g window-size smallest

# Enable True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Same keys as the window navigation in nvim
set -g @vim_navigator_mapping_left 'M-Left'
set -g @vim_navigator_mapping_right 'M-Right'
set -g @vim_navigator_mapping_up 'M-Up'
set -g @vim_navigator_mapping_down 'M-Down'
set -g @vim_navigator_mapping_prev ''
set -g @vim_navigator_prefix_mapping_clear_screen ''

# tpm has to run after every plugin is declared
run '~/.tmux/plugins/tpm/tpm'
